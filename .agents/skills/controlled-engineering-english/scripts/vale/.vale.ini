# CEE deterministic backend. Optional: every rule it checks is also applicable
# by review. See references/background.md, "Why Vale is optional".
#
# Run:  vale --config scripts/vale/.vale.ini <file>
#
# Glossary.yml is generated per project:
#   python3 scripts/glossary-to-vale.py <glossary> scripts/vale/styles/CEE/Glossary.yml

StylesPath = styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = CEE
