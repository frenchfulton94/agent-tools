# Companion to starter-compose-postgres.jsonc.
# Copy to .devcontainer/docker-compose.yml.
services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm

    # Paths are relative to THIS file. From .devcontainer/, ../.. reaches the
    # parent of the repo so the repo lands at /workspaces/<repo-name>.
    volumes:
      - ../..:/workspaces:cached

    # Required: without a long-running command the container exits immediately,
    # because overrideCommand defaults to false for Compose bases.
    command: sleep infinity

    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/app

    depends_on:
      - db

  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    # Named volume: without it, a rebuild wipes the database.
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
